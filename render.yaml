services:
  - type: web
    name: smart-agro-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_CLIENT_ID
        value: smart-agro-backend
      - key: MQTT_TOPIC_PREFIX
        value: smartagro
      - key: MQTT_DEVICE_ID
        value: esp32-01
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false

  - type: web
    name: smart-agro-dashboard
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smart-agro-api
          property: host
